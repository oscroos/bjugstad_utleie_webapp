:root{--navy:#0d3b4f;--navy2:#14536b;--teal:#14b8a6;--teal2:#0f766e;--bg:#f2f5f8;--line:#e2e8f0;--mut:#64748b;--mut2:#94a3b8;--ink:#0f172a;--ok:#15803d;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--info:#0369a1;--infobg:#e0f2fe;--lilla:#7c3aed;--lillabg:#ede9fe}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,Arial,sans-serif;background:#dde5ec;color:var(--ink);font-size:14px}
.shell{max-width:1240px;margin:14px auto;background:var(--bg);border:1px solid #cbd5e1;border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(2,20,30,.18);display:flex;flex-direction:column;min-height:92vh}
.top{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:32px;height:32px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-weight:800;color:#04303b;font-size:15px}
.tt{font-weight:650;font-size:15px;line-height:1.1}
.tt small{display:block;font-weight:400;font-size:9px;color:#93c5d3;text-transform:uppercase;letter-spacing:.07em}
.sok{flex:1;min-width:180px;max-width:420px;position:relative}
.sok input{width:100%;border:1px solid #2a607a;background:#124660;color:#fff;border-radius:9px;padding:7px 11px;font-size:12.5px;font-family:inherit}
.sok input::placeholder{color:#7fa8ba}
.sokres{position:absolute;top:36px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 10px 26px rgba(2,20,30,.2);z-index:50;max-height:300px;overflow:auto}
.sokres div{padding:8px 11px;font-size:12px;border-top:1px solid #eef2f6;cursor:pointer;color:var(--ink)}
.sokres div:hover{background:#f0fdfa}
.user{font-size:11px;text-align:right;color:#bcd6e0}
.user b{display:block;color:#fff;font-size:12px}
.main{display:flex;flex:1;min-height:0}
.nav{width:198px;background:#fff;border-right:1px solid var(--line);padding:10px 8px;flex-shrink:0}
.nav button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:9px;font-size:12.8px;color:#334155;cursor:pointer;font-family:inherit;margin-bottom:1px}
.nav button:hover{background:#f1f5f9}
.nav button.on{background:#0f766e12;color:var(--teal2);font-weight:650}
.nav .grp{font-size:8.5px;color:var(--mut2);text-transform:uppercase;letter-spacing:.09em;padding:10px 10px 4px;font-weight:700}
.nav .bdg{margin-left:auto;background:var(--badbg);color:var(--bad);border-radius:99px;font-size:9px;padding:1px 6px;font-weight:700}
.content{flex:1;padding:16px 18px;overflow-y:auto;min-width:0}
h1{font-size:17px;font-weight:650;margin:0 0 3px}
.sub{font-size:12px;color:var(--mut);margin:0 0 13px;line-height:1.55;max-width:860px}
.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:11px;box-shadow:0 1px 2px rgba(15,23,42,.05)}
.card h2{font-size:13.5px;font-weight:650;margin:0 0 7px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.met{background:var(--navy);color:#fff;border-radius:12px;padding:11px;text-align:center}
.met .v{font-size:20px;font-weight:750}.met .l{font-size:9.5px;opacity:.85;margin-top:1px}
.btn{background:#fff;border:1px solid #cbd5e1;border-radius:9px;padding:7px 13px;font-size:12.3px;cursor:pointer;font-family:inherit;color:var(--ink)}
.btn:hover{border-color:#94a3b8}
.btn-p{background:var(--teal2);border-color:var(--teal2);color:#fff}
.btn-p:hover{background:#0b5f58}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:11px;border-radius:8px}
input,select,textarea{border:1px solid #cbd5e1;border-radius:9px;padding:7px 10px;font-size:12.5px;font-family:inherit;background:#fff;color:var(--ink);max-width:100%}
textarea{width:100%;resize:vertical}
.pill{font-size:9px;padding:2px 8px;border-radius:99px;font-weight:700;white-space:nowrap;display:inline-block}
.pg{background:var(--okbg);color:var(--ok)}.pw{background:var(--warnbg);color:var(--warn)}.pd{background:var(--badbg);color:var(--bad)}.pn{background:#f1f5f9;color:#475569}.pb{background:var(--infobg);color:var(--info)}.pp{background:var(--lillabg);color:var(--lilla)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #eef2f6;font-size:12.3px;flex-wrap:wrap}
.row:first-of-type{border-top:none}
.mini{font-size:10px;color:var(--mut2)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:none;background:none;padding:8px 11px 7px;font-size:12.3px;color:var(--mut);border-bottom:2.5px solid transparent;cursor:pointer;font-family:inherit}
.tabs button.on{color:var(--teal2);border-bottom-color:var(--teal2);font-weight:650}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--teal2)}
.feltG{border-left:3px solid var(--ok);background:#f6fdf8;border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:12px}
.feltO{border-left:3px solid var(--warn);background:#fffbeb;border-radius:8px;padding:7px 10px;margin-bottom:6px;font-size:12px}
.chat{background:#fff;border:1px solid var(--line);border-radius:13px;display:flex;flex-direction:column;height:430px}
.chat .msgs{flex:1;overflow-y:auto;padding:13px}
.msg{max-width:82%;border-radius:12px;padding:8px 11px;font-size:12.4px;margin-bottom:8px;line-height:1.55;white-space:pre-wrap}
.msg.me{background:var(--teal2);color:#fff;margin-left:auto;border-bottom-right-radius:3px}
.msg.ai{background:#f1f5f9;border-bottom-left-radius:3px}
.chat .inp{display:flex;gap:7px;border-top:1px solid var(--line);padding:9px}
.chat .inp input{flex:1}
.mapwrap{max-width:720px}
.maplag{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap}
.maplag .btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
svg text{font-family:inherit}
.phone{width:100%;max-width:380px;background:var(--navy);border-radius:28px;padding:10px;box-shadow:0 16px 40px rgba(2,20,30,.3);margin:0 auto}
.scr{background:var(--bg);border-radius:20px;overflow:hidden;min-height:560px;display:flex;flex-direction:column}
.ptop{background:var(--navy);color:#fff;padding:11px 13px;display:flex;align-items:center;gap:8px;font-weight:650;font-size:13px}
.ptop small{display:block;font-weight:400;font-size:8.5px;color:#93c5d3;text-transform:uppercase;letter-spacing:.06em}
.pbody{padding:11px;flex:1;overflow-y:auto}
.pbody .card{padding:10px;margin-bottom:8px;border-radius:12px}
.chk{display:flex;align-items:center;gap:7px;padding:7px 0;border-top:1px solid #eef2f6;font-size:12px;flex-wrap:wrap}
.smb{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:4px 9px;font-size:11px;cursor:pointer;font-family:inherit;color:#475569}
.smb.ok{background:var(--okbg);border-color:#86efac;color:var(--ok)}
.smb.avv{background:var(--badbg);border-color:#fca5a5;color:var(--bad)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid #cbd5e1;border-radius:9px;padding:8px 10px;font-size:12px;cursor:pointer;font-family:inherit;margin-bottom:5px;color:var(--ink)}
.opt:hover{border-color:var(--teal2);background:#f0fdfa}
.demo{font-size:10px;color:var(--mut2);background:#fff;border:1px dashed #cbd5e1;border-radius:9px;padding:6px 10px;margin-bottom:11px}
.pilrad{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid #eef2f6;font-size:12.3px;flex-wrap:wrap}
.pil{color:var(--teal2);font-weight:800}

function vJurist(){
 var h='<h1>Minijurist</h1><p class="sub">Entrepriserettslig førstehjelp koblet til prosjektdataene. Viser alltid rettsgrunnlag, og anbefaler advokat i komplekse tvister – gir aldri fulltekst fra betalte rettskilder (AP-9).</p>';
 h+='<div class="chat"><div class="msgs" id="jm">';

function jSend(){
 var q=S.jin.trim();if(!q)return;S.jchat.push({me:true,t:q});var ql=q.toLowerCase();var svar;
 if(ql.indexOf("varsl")>=0||ql.indexOf("endring")>=0)svar="Varsling av endring (NS 8407 pkt. 32 / NS 8405 pkt. 23):\n\n1) Varsle «uten ugrunnet opphold» etter at dere ble/burde blitt klar over forholdet – dager, ikke uker.\n2) Skriftlig, til byggherrens representant.\n3) Hold kravet oppdatert med tidsnære registreringer (lass, timer, dagbok) – Høyesterett i HR-2019-1225-A (to-trinns beviskravet) gjør løpende dokumentasjon avgjørende for å nå frem.\n\n→ EO-modulen gjør dette for deg: «mulig endring» fra felt + varselknapp + periodiske oppdateringer. Dette er veiledning, ikke rettsråd – ta advokat ved tvist av betydning.";
 else if(ql.indexOf("faktur")>=0||ql.indexOf("omtvist")>=0)svar="Omtvistede krav: Ja – dere kan og bør fakturere omtvistet beløp som eget, tydelig merket krav (NS 8407 pkt. 30.2-sporet). Byggherren plikter å betale uomtvistet del. Renter løper etter forsinkelsesrenteloven på forfalt, berettiget krav.\n\nPraktisk: skill omtvistet/uomtvistet i fakturaen, referer EO-nummer, og vis til loggen i EO-modulen. Ved uenighet over tid: vurder oppmann/mekling før søksmål – og advokat.";
 else if(ql.indexOf("svarer ikke")>=0)svar="Når byggherren ikke svarer på et endringsvarsel:\n\n1) Send purring med svarfrist og pek på at passivitet kan medføre at innsigelser tapes (NS-systemets svarplikt).\n2) Fortsett arbeidet iht. instruks/kontrakt, men dokumentér alt tidsnært (EO-loggen).\n3) Oppdateringsintervallet i EO-03 («hver fredag») er nettopp for å bygge denne tidslinjen.\n\nStatusfeltet «Varslet – venter svar» + datostemplene er beviset deres. Komplekst? → advokat.";
 else if(ql.indexOf("slutt")>=0)svar="Sluttoppgjør (NS 8407 pkt. 39): sluttfaktura med sluttoppstilling sendes innen 2 måneder etter overtakelse. Krav som ikke er med (eller varslet tidligere), tapes som hovedregel. Byggherrens frist for innsigelser: 2 måneder fra mottak.\n\n→ Sett fristen i prosjektets KPI-panel – portalen varsler 3 uker før.";
 else svar="Det kan jeg si noe generelt om, men her er det lurt å være presis: still spørsmålet med kontraktstype (NS 8405/8406/8407) og hva som faktisk har skjedd, så peker jeg på riktig bestemmelse og hva dere bør dokumentere. Husk: jeg er førstehjelp – advokat ved reelle tvister.";
 S.jchat.push({me:false,t:svar});S.jin="";render();
 var el=document.getElementById("jm");if(el)el.scrollTop=el.scrollHeight;
}

/* ───────────────────────── GLOBALT SØK + RAMME ───────────────────────── */
function sokRes(){
 var q=S.q.toLowerCase();if(!q||q.length<2)return "";
 var hits=[];
 PRO.forEach(function(p){if((p.nr+" "+p.navn).toLowerCase().indexOf(q)>=0)hits.push({t:"📁 "+p.nr+" "+p.navn,go:function(){S.pid=p.id;S.view="proj";}});});
 FLEET.forEach(function(m){if((m.id+" "+m.navn).toLowerCase().indexOf(q)>=0)hits.push({t:"🚜 "+m.id+" "+m.navn,go:function(){S.sel=m.id;S.view="kart";}});});
 CREW.forEach(function(c){if(c.n.toLowerCase().indexOf(q)>=0)hits.push({t:"👷 "+c.n+" ("+c.r+")",go:function(){S.view="mann";S.mtab="liste";}});});
 S.eo.list.forEach(function(e){if(e.tit.toLowerCase().indexOf(q)>=0)hits.push({t:"⚠ "+(e.eo?e.eo+" ":"")+e.tit,go:function(){S.view="proj";S.ptab="eo";}});});
 [["avrop","📄 Avrop AVR-2026-013"],["dokument","📁 Dokumenthotellet"],["epd","🌱 EPD-register / CO2"]].forEach(function(x){if(x[0].indexOf(q)>=0)hits.push({t:x[1],go:function(){S.view=x[0]==="epd"?"rap":"dok";if(x[0]==="epd")S.rtab="co2";}});});
 if(!hits.length)return '<div class="mini" style="padding:8px 11px">Ingen treff på «'+esc(S.q)+'»</div>';
 window.__sokHits=hits;
 return hits.slice(0,8).map(function(h,i){return '<div onclick="__sokHits['+i+'].go();S.q=\'\';S.sokOpen=false;render()">'+esc(h.t)+'</div>';}).join("");
}
var NAV=[
 ["grp","Oversikt"],["over","🏠 Oversikt"],["kart","🗺 Anleggskart"],
 ["grp","Drift"],["proj","📁 Prosjekter"],["flate","🚜 Flåte & AI"],["mkoord","🔁 Massekoordinering"],["mann","👷 Mannskap"],
 ["grp","Kvalitet & rapport"],["rap","🧾 Rapportering"],["hms","🦺 HMS & kvalitet"],["jurist","⚖ Minijurist"],["std","📄 Standardbibliotek"],
 ["grp","Dokument & avtale"],["dok","🗂 Dokumenter & avrop"],["feed","💬 Feed"],
 ["grp","Felt & admin"],["appv","📱 Sjåførapp"],["admin","⚙ Admin & roller"]
];
function render(){
 var h='<div class="top"><div class="logo">A</div><div class="tt">AnleggsPortalen<small>samlet testprototype · alle moduler · demo-data</small></div>';
 h+='<div class="sok"><input placeholder="Søk i alt: prosjekter, maskiner, folk, EO, dokumenter…" value="'+esc(S.q)+'" oninput="S.q=this.value;S.sokOpen=true;render();this.focus();this.setSelectionRange(this.value.length,this.value.length)">'+(S.sokOpen&&S.q?'<div class="sokres">'+sokRes()+'</div>':'')+'</div>';
 h+='<div class="user"><b>Kari Nordmann</b>Admin bedrift · Entreprenør AS</div></div>';
 h+='<div class="main"><div class="nav">';
 NAV.forEach(function(n){
  if(n[0]==="grp"){h+='<div class="grp">'+n[1]+'</div>';return;}
  var bdg="";
  if(n[0]==="proj"&&S.eo.list.some(function(e){return e.st==="POSSIBLE";}))bdg='<span class="bdg">EO</span>';
  if(n[0]==="mann"&&S.tid.some(function(t){return t.st==="SUBMITTED";}))bdg='<span class="bdg">'+S.tid.filter(function(t){return t.st==="SUBMITTED";}).length+'</span>';
  h+='<button class="'+(S.view===n[0]?"on":"")+'" onclick="S.view=\''+n[0]+'\';S.sokOpen=false;render()">'+n[1]+bdg+'</button>';
 });
 h+='</div><div class="content">';
 h+=demoNote("alle data er fiktive og alt kjører lokalt i denne HTML-filen – ingen API-kall.");
 var v=S.view;
 h+= v==="over"?vOversikt(): v==="kart"?vKart(): v==="proj"?vProsjekt(): v==="rap"?vRap(): v==="flate"?vFlate(): v==="mkoord"?vKoord(): v==="mann"?vMann(): v==="hms"?vHms(): v==="dok"?vDok(): v==="feed"?vFeed(): v==="jurist"?vJurist(): v==="std"?vStd(): v==="admin"?vAdmin(): v==="appv"?vApp(): vOversikt();
 h+='</div></div>';
 document.getElementById("app").innerHTML=h;
}
render();
